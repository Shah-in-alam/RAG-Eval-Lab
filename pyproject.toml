[project]
name = "rag-eval-lab"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: needs downloaded models (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
filterwarnings = ["ignore:builtin type .* has no __module__:DeprecationWarning"]
